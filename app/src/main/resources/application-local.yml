# Local dev profile — runs in-memory with libpostal sidecar.
#
# Usage:
#   make up-sidecars && make app     (with real parsing)
#   LIBPOSTAL_ENABLED=false make app (HTTP-only, no structurers)
#
# What's different from default:
#   - H2 in-memory database (both pools) instead of Oracle
#   - Liquibase disabled (H2 schema created via spring.sql.init)
#   - Kafka disabled (no broker needed)
#   - RabbitMQ disabled (no broker needed)
#   - libpostal enabled by default (expects sidecar on :50051)
#   - LLM configurable via LLM_ENABLED + LLM_API_KEY
#   - SWIFT CRF disabled (stub)
#   - Stub structurer DISABLED (not used in real flows)
#   - Compliance in shadow mode (log only)
#   - HTTP always on at :8080

spring:
  datasource:
    legacy-read:
      jdbc-url: jdbc:h2:mem:legacy;DB_CLOSE_DELAY=-1;MODE=Oracle
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: legacy-read-pool
        maximum-pool-size: 5
        minimum-idle: 1
        read-only: true
        auto-commit: true
        connection-init-sql:
    app-write:
      jdbc-url: jdbc:h2:mem:app;DB_CLOSE_DELAY=-1;MODE=Oracle
      username: sa
      password:
      driver-class-name: org.h2.Driver
      hikari:
        pool-name: app-write-pool
        maximum-pool-size: 5
        minimum-idle: 1
        auto-commit: true
        connection-init-sql:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  kafka:
    bootstrap-servers: localhost:29092
    listener:
      auto-startup: false

  rabbitmq:
    host: localhost

liquibase:
  enabled: false

enrichment:
  cascade:
    order: [libpostal, llm]
    early-exit-threshold: 0.80
    timeout-ms: 5000

  libpostal:
    enabled: ${LIBPOSTAL_ENABLED:true}
    endpoint: ${LIBPOSTAL_ENDPOINT:localhost:50051}
    timeout-ms: 2000
  swift-crf:
    enabled: false
  llm:
    enabled: ${LLM_ENABLED:true}
    type: ${LLM_TYPE:azure-openai}
    endpoint: ${AZURE_OPENAI_ENDPOINT:https://azuretest123.openai.azure.com/openai/deployments/${AZURE_OPENAI_DEPLOYMENT_NAME:gpt-4.1-mini}}
    api-key: ${AZURE_OPENAI_API_KEY:}
    timeout-ms: 5000

  kafka:
    enabled: false
  rabbitmq:
    enabled: false

  test:
    stub:
      enabled: false

  compliance:
    enabled: true
    shadow-mode: true

  accuracy:
    sampling:
      enabled: false

  backfill:
    enabled: false

server:
  port: 8080

logging:
  level:
    com.jpmc.tfpm.address: DEBUG
    org.springframework.kafka: OFF
    org.springframework.amqp: OFF
