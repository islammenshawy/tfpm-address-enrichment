# Spring Boot configuration for the TFPM Address Enrichment Service.
#
# Environment-specific overrides come from:
#   - application-local.yml (local dev, gitignored if it has secrets)
#   - application-uat.yml   (UAT env, ConfigMap)
#   - application-prod.yml  (Prod env, ConfigMap + Secret refs)
#
# Never bake credentials into this file. Secrets resolve via Vault in real
# environments and via env vars locally.

spring:
  application:
    name: tfpm-address-enrichment

  # ============================================================
  # Two HikariCP pools — read/write separation enforced at the DB
  # level. legacy-read uses TFPM_LEGACY_RO (SELECT only). app-write
  # uses TFPM_ADDR_ENRICH_APP (DML on TFPM_ADDR_ENRICH only).
  # Pool sizes assume 3-4 replicas; coordinate with DBA on max
  # session limit before increasing.
  # ============================================================
  datasource:
    legacy-read:
      jdbc-url: ${ORACLE_LEGACY_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
      username: ${ORACLE_LEGACY_USER:TFPM_LEGACY_RO}
      password: ${ORACLE_LEGACY_PASSWORD:oracle}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        pool-name: legacy-read-pool
        maximum-pool-size: 30
        minimum-idle: 5
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000
        read-only: true
        auto-commit: true
        connection-init-sql: ALTER SESSION SET ISOLATION_LEVEL = READ COMMITTED
    app-write:
      jdbc-url: ${ORACLE_APP_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
      username: ${ORACLE_APP_USER:TFPM_ADDR_ENRICH_APP}
      password: ${ORACLE_APP_PASSWORD:oracle}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        pool-name: app-write-pool
        maximum-pool-size: 50
        minimum-idle: 10
        connection-timeout: 5000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: true
        connection-init-sql: ALTER SESSION SET ISOLATION_LEVEL = READ COMMITTED

  # ============================================================
  # Kafka consumer/producer config. Cooperative-sticky assignor at
  # the factory level (not the listener annotation) so all consumers
  # in this app use it consistently.
  # ============================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: tfpm-address-enrichment
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 100
      properties:
        max.poll.interval.ms: 300000
        session.timeout.ms: 45000
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
        isolation.level: read_committed
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
    listener:
      ack-mode: manual
      concurrency: 3
      missing-topics-fatal: false

  # ============================================================
  # RabbitMQ via Spring AMQP. Idempotency table provides
  # exactly-once semantics. Manual ack after Oracle commit.
  # ============================================================
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

# ============================================================
# The cascade configuration. Adding a new structurer means:
#   1. Drop a new adapter module
#   2. Add a config block here
#   3. Insert its name into enrichment.cascade.order
# No code changes anywhere else.
# ============================================================
enrichment:
  cascade:
    # Order in which structurers are invoked. Each subsequent structurer
    # only runs if the cumulative result has not yet hit the early-exit
    # threshold on all required fields.
    order: [libpostal, llm]
    early-exit-threshold: ${CASCADE_EARLY_EXIT:0.99}
    timeout-ms: ${CASCADE_TIMEOUT:30000}
    min-sources: ${CASCADE_MIN_SOURCES:2}
    # Consensus: compare outputs across structurers, flag disagreements.
    # Disable for single-model mode (consensus requires 2+ sources).
    consensus-enabled: ${CASCADE_CONSENSUS:true}
    parallel: ${CASCADE_PARALLEL:true}
    required-fields: [CTRY, TWN_NM]
    routing:
      # Non-Western: LLM runs first (better accuracy), libpostal as cross-check
      CN: [llm, libpostal]
      AE: [llm, libpostal]
      HK: [llm, libpostal]
      SG: [llm, libpostal]
  # Confidence threshold below which a result goes to EXCEPTION_QUEUE
  # for human review. Calibrated, not raw.
  review-threshold: 0.70

  # ----- Compliance routing (four-axis decision) -----
  compliance:
    enabled: ${COMPLIANCE_ENABLED:true}
    field-confidence-floor:
      CTRY: 0.95
      TWN_NM: 0.80
      CTRY_SUB_DVSN: 0.75
    overall-confidence-floor: 0.85
    high-risk-countries-resource: classpath:compliance/high-risk-countries.csv
    pattern-triggers-resource: classpath:compliance/sanctions-patterns.csv
    fail-safe-action: CONSERVATIVE
    shadow-mode: ${COMPLIANCE_SHADOW:true}

  # ----- Structurer: libpostal -----
  libpostal:
    enabled: ${LIBPOSTAL_ENABLED:true}
    endpoint: ${LIBPOSTAL_ENDPOINT:localhost:50051}
    timeout-ms: 500
    bulkhead:
      max-concurrent-calls: 50
      max-wait-duration-ms: 100

  # ----- Structurer: SWIFT CRF (stub today; real impl when downloaded) -----
  swift-crf:
    enabled: ${SWIFT_CRF_ENABLED:false}
    endpoint: ${SWIFT_CRF_ENDPOINT:localhost:50052}
    timeout-ms: 500
    bulkhead:
      max-concurrent-calls: 30
      max-wait-duration-ms: 100

  # ----- Structurer: internal LLM gateway -----
  llm:
    enabled: ${LLM_ENABLED:false}
    type: ${LLM_TYPE:openai-compatible}
    endpoint: ${LLM_ENDPOINT:http://localhost:8089}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout-ms: 2000
    fields-allowed: [CTRY, TWN_NM, PST_CD, CTRY_SUB_DVSN, STRT_NM, BLDG_NB, BLDG_NM]
    bulkhead:
      max-concurrent-calls: 20
      max-wait-duration-ms: 200
    prompt:
      template-resource: classpath:prompts/address-structuring.json

  # ----- Inbound/outbound channel config (on/off per channel) -----
  # HTTP is always enabled. Kafka and RabbitMQ are configurable.
  http:
    enabled: true
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    input-topic: ${KAFKA_INPUT_TOPIC:tfpm.address.enrichment.input}
    output-topic: ${KAFKA_OUTPUT_TOPIC:tfpm.address.enrichment.output}
    dlt-topic: ${KAFKA_DLT_TOPIC:tfpm.address.enrichment.input.dlt}
  rabbitmq:
    enabled: ${RABBITMQ_ENABLED:false}
    input-queue: ${RABBITMQ_INPUT_QUEUE:tfpm.address.enrichment.input}
    output-queue: ${RABBITMQ_OUTPUT_QUEUE:tfpm.address.enrichment.output}
    dlq: ${RABBITMQ_DLQ:tfpm.address.enrichment.input.dlq}

# ============================================================
# Resilience4j circuit breakers and bulkheads. Names map to the
# instance names used in the structurer adapters.
# ============================================================
resilience4j:
  circuitbreaker:
    instances:
      libpostal-cb:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1s
        sliding-window-size: 100
        minimum-number-of-calls: 20
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
      swift-crf-cb:
        failure-rate-threshold: 50
        sliding-window-size: 100
        minimum-number-of-calls: 20
        wait-duration-in-open-state: 30s
      llm-cb:
        failure-rate-threshold: 50
        sliding-window-size: 50
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 60s
  bulkhead:
    instances:
      libpostal-bh:
        max-concurrent-calls: 50
        max-wait-duration: 100ms
      swift-crf-bh:
        max-concurrent-calls: 30
        max-wait-duration: 100ms
      llm-bh:
        max-concurrent-calls: 20
        max-wait-duration: 200ms
  # Retry: Layer 2 (per-structurer) is handled by each client implementation:
  #   - LLM: Reactor retryWhen in OpenAiCompatibleLlmClient/JpmcInternalGatewayLlmClient
  #   - Libpostal: catches StatusRuntimeException, returns empty result
  #   - SwiftCrf: stub (disabled)
  # Layer 3 (persistence): @Retryable on Oracle DML methods (spring-retry)

# ============================================================
# Tomcat — bounded request handling. 503 + Retry-After on overflow
# instead of unbounded queue growth.
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200
      min-spare: 25
    accept-count: 100
    max-connections: 500
  shutdown: graceful

# ============================================================
# Liquibase — applied at startup if enabled. In production we run
# migrations as a separate ops job, so this is false there.
# ============================================================
liquibase:
  enabled: ${LIQUIBASE_ENABLED:false}
  change-log: classpath:/infra/liquibase/changelog-master.xml

# ============================================================
# Observability. Prometheus scrape on /actuator/prometheus,
# health on /actuator/health, structured JSON logs via Logback.
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENV:local}

logging:
  level:
    root: INFO
    com.jpmc.tfpm.address: INFO
    org.springframework.kafka: WARN
    org.hibernate: WARN
    org.jooq: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","logger":"%logger{40}","thread":"%thread","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}","message":"%msg"}%n'
